<title>Дневник тренировок</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Golos+Text:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column like a coach's clipboard — day tabs, exercise cards with set rows, history below */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#16202b; --muted:#5d6b78; --line:#d5dce3;
  --accent:#1f6feb; --accent-ink:#ffffff; --good:#1a7f4b; --chip:#e3ebf7;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151c; --surface:#18212b; --ink:#e6ecf2; --muted:#93a1ae; --line:#2a3542;
  --accent:#5b9cff; --accent-ink:#0b1320; --good:#4cc38a; --chip:#1f2c3b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151c; --surface:#18212b; --ink:#e6ecf2; --muted:#93a1ae; --line:#2a3542;
  --accent:#5b9cff; --accent-ink:#0b1320; --good:#4cc38a; --chip:#1f2c3b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:640px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
header h1{font-family:var(--display);font-weight:700;font-size:34px;letter-spacing:.01em;margin:0;text-transform:uppercase;line-height:1}
header p{margin:6px 0 0;color:var(--muted);font-size:14px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tab{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.tab b{font-family:var(--display);font-size:20px;line-height:1}
.tab span{font-size:11px;color:var(--muted);text-align:center}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab[aria-selected="true"] span{color:var(--accent-ink);opacity:.85}
.tab:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.meta{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
.meta label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ex-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ex-h h3{margin:0;font-size:15px;font-weight:600}
.target{font-family:var(--display);font-size:16px;color:var(--muted);white-space:nowrap}
.last{font-size:12px;color:var(--muted)}
.last b{color:var(--good);font-weight:600}
.sets{display:grid;grid-template-columns:28px 1fr 1fr;gap:6px 8px;align-items:center}
.sets .hd{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sets .n{font-family:var(--display);font-size:18px;color:var(--muted);text-align:center}
.sets input{width:100%;font-variant-numeric:tabular-nums}
.addset{align-self:start;font:inherit;font-size:13px;background:none;border:none;color:var(--accent);cursor:pointer;padding:2px 0}
.save{font:inherit;font-weight:600;font-size:16px;background:var(--accent);color:var(--accent-ink);border:none;border-radius:12px;padding:13px;cursor:pointer}
.save:disabled{opacity:.6;cursor:default}
.status{min-height:20px;font-size:14px;color:var(--good);text-align:center}
.status.err{color:#c4372b}
h2{font-family:var(--display);font-weight:700;font-size:24px;text-transform:uppercase;margin:6px 0 0}
.hist{display:flex;flex-direction:column;gap:8px}
.h-item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.h-top{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.h-top .d{font-weight:600}
.pill{background:var(--chip);border-radius:999px;padding:1px 9px;font-size:12px}
.h-item ul{margin:6px 0 0;padding:0;list-style:none;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.h-item ul b{color:var(--ink);font-weight:500}
.del{font:inherit;font-size:12px;background:none;border:none;color:var(--muted);cursor:pointer;padding:0;text-decoration:underline}
.empty{color:var(--muted);font-size:14px;background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:14px}
.note{font-size:12px;color:var(--muted)}
textarea{width:100%;resize:vertical}
@media (prefers-reduced-motion:no-preference){.tab,.save{transition:background .15s,opacity .15s}}
</style>

<div class="wrap">
  <header>
    <h1>Дневник тренировок</h1>
    <p>Межсезонье: 3 силовые + 1 кардио в неделю. Записывай вес и повторы — рядом увидишь прошлый результат.</p>
  </header>

  <div class="tabs" role="tablist" id="tabs"></div>

  <div class="meta">
    <label for="date">Дата<input type="date" id="date"></label>
  </div>

  <div id="form" style="display:flex;flex-direction:column;gap:10px"></div>

  <button class="save" id="save">Сохранить тренировку</button>
  <div class="status" id="status" role="status"></div>

  <h2 id="histTitle">История</h2>
  <div class="hist" id="hist"><div class="empty">Загружаю записи…</div></div>
  <p class="note" id="storeNote"></p>
</div>

<script>
const PLAN = {
  d1:{short:"Ноги",name:"Ноги + взрывная сила",ex:[
    ["Прыжки на тумбу","4×5",4,"см"],["Приседания со штангой","4×5",4],["Болгарские сплит-приседы","3×8 на ногу",3],
    ["Румынская тяга","3×8",3],["Подъёмы на носки на одной ноге","3×12",3],["Боковая планка","3×30 сек",3,"сек"]]},
  d2:{short:"Верх",name:"Верх тела",ex:[
    ["Подтягивания","4×макс",4],["Жим гантелей лёжа","3×8–10",3],["Тяга гантели в наклоне","3×10 на руку",3],
    ["Жим гантелей стоя","3×10",3],["Отжимания на брусьях","3×макс",3],["Подъёмы ног в висе","3×12",3]]},
  d3:{short:"Всё тело",name:"Всё тело + скорость",ex:[
    ["Выпады в прыжке","3×6 на ногу",3],["Становая тяга","4×5",4],["Скандинавские сгибания","3×5",3],
    ["Жим одной рукой стоя","3×8",3],["Махи гирей","3×15",3],["Ab-wheel / паллоф-пресс","3×10",3]]},
  d4:{short:"Кардио",name:"Кардио: дорожка или гребля",cardio:true}
};
const $=s=>document.querySelector(s);
let day="d1", sessions=[], col=null, unsub=null;
const LS="trener_sessions_v1";

function today(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
$("#date").value=today();

function renderTabs(){
  $("#tabs").innerHTML="";
  Object.entries(PLAN).forEach(([k,p],i)=>{
    const b=document.createElement("button");b.className="tab";b.id="tab-"+k;b.setAttribute("role","tab");
    b.setAttribute("aria-selected",k===day);b.innerHTML=`<b>День ${i+1}</b><span></span>`;b.querySelector("span").textContent=p.short;
    b.onclick=()=>{day=k;try{localStorage.setItem("trener_day",k)}catch(e){};renderTabs();renderForm();renderHist()};
    $("#tabs").appendChild(b);
  });
}
function lastFor(exName){
  for(const s of sessions){ if(s.day!==day) continue; const e=(s.entries||[]).find(x=>x.ex===exName); if(e) return {date:s.date,sets:e.sets}; }
  return null;
}
function fmtSets(sets,unit){return sets.filter(x=>x.r||x.w).map(x=>(x.w?x.w+(unit==="см"?" см":" кг")+"×":"")+(x.r||"–")).join(", ")}
function fmtDate(d){const [y,m,dd]=d.split("-");return dd+"."+m}

function renderForm(){
  const p=PLAN[day], f=$("#form"); f.innerHTML="";
  if(p.cardio){
    const last=sessions.find(s=>s.day==="d4");
    f.innerHTML=`<div class="ex">
      <div class="ex-h"><h3>${p.name}</h3></div>
      ${last?`<div class="last">Прошлый раз (${fmtDate(last.date)}): <b></b></div>`:""}
      <div class="meta">
        <label for="c-type">Тренажёр<select id="c-type"><option>Дорожка — интервалы</option><option>Гребля — ровный темп</option><option>Гребля — 500 м × 5</option><option>Дорожка — ровный бег</option></select></label>
        <label for="c-min">Минуты<input id="c-min" type="number" inputmode="numeric" style="width:90px"></label>
        <label for="c-dist">Дистанция, м<input id="c-dist" type="number" inputmode="numeric" style="width:110px"></label>
      </div>
      <label for="c-note" class="note">Заметка (темп, самочувствие)</label>
      <textarea id="c-note" rows="2"></textarea>
    </div>`;
    if(last){f.querySelector(".last b").textContent=[last.cardio.type,last.cardio.min&&last.cardio.min+" мин",last.cardio.dist&&last.cardio.dist+" м"].filter(Boolean).join(" · ")}
    return;
  }
  p.ex.forEach(([name,target,n,unit],ei)=>{
    const box=document.createElement("div");box.className="ex";box.dataset.ex=name;
    const last=lastFor(name);
    box.innerHTML=`<div class="ex-h"><h3></h3><span class="target">${target}</span></div>
      ${last?`<div class="last">Прошлый раз (${fmtDate(last.date)}): <b></b></div>`:`<div class="last">Первая запись — начни с веса, который делаешь с запасом 2 повтора.</div>`}
      <div class="sets"><span class="hd">#</span><span class="hd">${unit==="см"?"Высота, см":"Вес, кг"}</span><span class="hd">${unit==="сек"?"Секунды":"Повторы"}</span></div>
      <button class="addset" type="button">+ подход</button>`;
    box.querySelector("h3").textContent=name;
    if(last) box.querySelector(".last b").textContent=fmtSets(last.sets,unit)||"—";
    const grid=box.querySelector(".sets");
    const add=(k)=>{const i=grid.querySelectorAll(".n").length;
      grid.insertAdjacentHTML("beforeend",`<span class="n">${i+1}</span><input id="w-${day}-${ei}-${i}" type="number" step="0.5" inputmode="decimal" placeholder="${last&&last.sets[i]?last.sets[i].w||"":""}" aria-label="${name}, подход ${i+1}, вес"><input id="r-${day}-${ei}-${i}" type="number" inputmode="numeric" placeholder="${last&&last.sets[i]?last.sets[i].r||"":""}" aria-label="${name}, подход ${i+1}, повторы">`)};
    for(let i=0;i<n;i++) add();
    box.querySelector(".addset").onclick=add;
    f.appendChild(box);
  });
}

function collect(){
  const p=PLAN[day], s={day,date:$("#date").value||today(),created:Date.now()};
  if(p.cardio){
    s.cardio={type:$("#c-type").value,min:+$("#c-min").value||0,dist:+$("#c-dist").value||0,note:$("#c-note").value.trim()};
    if(!s.cardio.min&&!s.cardio.dist) return null;
    return s;
  }
  s.entries=[];
  document.querySelectorAll("#form .ex").forEach(box=>{
    const ins=[...box.querySelectorAll(".sets input")], sets=[];
    for(let i=0;i<ins.length;i+=2){const w=+ins[i].value||0,r=+ins[i+1].value||0;if(w||r)sets.push({w,r})}
    if(sets.length) s.entries.push({ex:box.dataset.ex,sets});
  });
  return s.entries.length?s:null;
}

function renderHist(){
  const list=sessions.filter(s=>s.day===day), h=$("#hist");
  $("#histTitle").textContent="История — "+PLAN[day].short;
  if(!list.length){h.innerHTML=`<div class="empty">Пока пусто. Заполни подходы выше и нажми «Сохранить тренировку» — запись появится здесь.</div>`;return}
  h.innerHTML="";
  list.slice(0,12).forEach(s=>{
    const it=document.createElement("div");it.className="h-item";
    it.innerHTML=`<div class="h-top"><span class="d">${fmtDate(s.date)}.${s.date.slice(0,4)}</span><button class="del" type="button">Удалить</button></div><ul></ul>`;
    const ul=it.querySelector("ul");
    if(s.cardio){const li=document.createElement("li");li.textContent=[s.cardio.type,s.cardio.min&&s.cardio.min+" мин",s.cardio.dist&&s.cardio.dist+" м",s.cardio.note].filter(Boolean).join(" · ");ul.appendChild(li)}
    (s.entries||[]).forEach(e=>{const li=document.createElement("li");const b=document.createElement("b");b.textContent=e.ex+": ";li.appendChild(b);li.append(fmtSets(e.sets));ul.appendChild(li)});
    const del=it.querySelector(".del");
    del.onclick=async()=>{
      if(del.dataset.arm!=="1"){del.dataset.arm="1";del.textContent="Точно удалить?";setTimeout(()=>{del.dataset.arm="";del.textContent="Удалить"},3000);return}
      await removeSession(s);
    };
    h.appendChild(it);
  });
}
function sortS(){sessions.sort((a,b)=>(b.date.localeCompare(a.date))||(b.created-a.created))}

function loadLocal(){try{sessions=JSON.parse(localStorage.getItem(LS)||"[]")}catch(e){sessions=[]}sortS()}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(sessions))}catch(e){}}

async function removeSession(s){
  try{ if(col&&s._id) await col.doc(s._id).delete(); else {sessions=sessions.filter(x=>x!==s);saveLocal();sortS()} }
  catch(e){status("Не удалось удалить: "+(e.message||e.code),true);return}
  if(!col){renderForm();renderHist()}
}
function status(t,err){const el=$("#status");el.textContent=t;el.className="status"+(err?" err":"");if(!err)setTimeout(()=>{if(el.textContent===t)el.textContent=""},3500)}

$("#save").onclick=async()=>{
  const s=collect(); if(!s){status("Заполни хотя бы один подход",true);return}
  $("#save").disabled=true;
  try{
    if(col){await col.add(s)} else {sessions.push(s);sortS();saveLocal();renderHist()}
    status("Сохранено ✓"); renderForm();
  }catch(e){status("Не сохранилось: "+(e.message||e.code||"ошибка")+". Попробуй ещё раз.",true)}
  $("#save").disabled=false;
};

try{const d=localStorage.getItem("trener_day");if(d&&PLAN[d])day=d}catch(e){}
renderTabs(); loadLocal(); renderForm(); renderHist();
$("#storeNote").textContent="Записи пока хранятся только в этом браузере.";

(async()=>{
  try{
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    col=db.collection("data/users/"+id);
    $("#storeNote").textContent="Записи сохраняются в твоём аккаунте и видны только тебе — с любого устройства.";
    unsub=col.onSnapshot(snap=>{
      sessions=snap.docs.map(d=>Object.assign({_id:d.id},d.data()));sortS();
      const typing=[...document.querySelectorAll("#form input,#form textarea")].some(x=>x.value);
      if(!typing) renderForm(); renderHist();
    },err=>{status("Не удалось загрузить историю: "+(err.message||err.code),true)});
  }catch(e){}
})();
</script>
